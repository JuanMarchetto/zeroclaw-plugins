name: kani-proofs

# Fork-side by design: the upstream plugin PR must not touch .github/, so the Kani
# proofs run on this dedicated branch. PROOFS.md links a specific green run here.
on:
  push:
    branches: [ci-kani]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani proofs (P6 malleability, P7 crash-safety)
        working-directory: plugins/jupiter-swap-guard
        run: cargo kani
